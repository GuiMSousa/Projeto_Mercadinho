<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Contro Vend — Entrar</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#047857" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Contro Vend" />
  <link rel="apple-touch-icon" href="/img/icon-192.png" />
</head>
<body>
  <main class="login-wrap">
    <form id="login-form" class="card login-card">
      <div class="brand-mark" aria-hidden="true">CV</div>
      <h1>Contro Vend</h1>
      <p class="muted">Controle de vendas e estoque</p>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required maxlength="255" />

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" />

      <button type="submit">Entrar</button>
      <p id="login-error" class="error" role="alert" hidden></p>

      <div class="login-links">
        <a href="/recuperar-senha.html" class="link-action">Esqueci minha senha</a>
        <a href="/cadastro.html" class="link-action">Cadastre-se</a>
      </div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
