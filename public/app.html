<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contro Vend</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Contro Vend</div>
    <nav id="tabs" class="tabs">
      <button data-tab="dashboard" class="tab-btn active">Painel</button>
      <button data-tab="vendas" class="tab-btn">Vendas</button>
      <button data-tab="caixa" class="tab-btn">Caixa</button>
      <button data-tab="produtos" class="tab-btn">Produtos</button>
      <button data-tab="estoque" class="tab-btn" data-admin-only>Estoque</button>
      <button data-tab="importar" class="tab-btn" data-admin-only>Importar</button>
      <button data-tab="relatorios" class="tab-btn" data-admin-only>Relatórios</button>
      <button data-tab="usuarios" class="tab-btn" data-admin-only>Usuários</button>
    </nav>
    <button id="cash-chip" type="button" class="cash-chip" hidden></button>
    <div class="user-box">
      <span id="user-avatar" class="user-avatar" aria-hidden="true"></span>
      <span id="user-name"></span>
      <button id="logout-btn" class="secondary">Sair</button>
    </div>
  </header>

  <main id="content" class="content"></main>

  <template id="tpl-dashboard">
    <section>
      <h2>Painel</h2>
      <div id="admin-summary" class="grid-cards" hidden>
        <div class="card stat"><span class="stat-label">Vendas hoje</span><span id="stat-today" class="stat-value">—</span></div>
        <div class="card stat"><span class="stat-label">Vendas no mês</span><span id="stat-month" class="stat-value">—</span></div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3>Estoque baixo</h3>
          <div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Estoque</th><th>Mínimo</th></tr></thead><tbody id="tb-low-stock"></tbody></table></div>
        </div>
        <div class="card">
          <h3>Previsão de esgotar em 7 dias</h3>
          <div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Estoque</th><th>Dias restantes</th></tr></thead><tbody id="tb-soon-out"></tbody></table></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3>Vencendo em breve</h3>
          <div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Validade</th><th>Estoque</th></tr></thead><tbody id="tb-expiring"></tbody></table></div>
        </div>
        <div class="card" id="card-slow-moving" hidden>
          <h3>Produtos parados (sem venda em 60 dias)</h3>
          <div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Estoque</th></tr></thead><tbody id="tb-slow-moving"></tbody></table></div>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-vendas">
    <section>
      <div id="sale-cash-warning" class="banner warn" hidden>
        <span>Caixa fechado: as vendas não vão entrar em nenhum fechamento de caixa.</span>
        <button type="button" id="sale-open-cash-btn" class="btn-xl">Abrir caixa</button>
      </div>
      <h2>Nova venda</h2>
      <div class="card op">
        <div class="sale-picker">
          <input id="sale-search" class="field-xl" type="text" placeholder="Buscar produto por nome ou código de barras..." aria-label="Buscar produto para adicionar à venda" />
          <div id="sale-results" class="search-results"></div>
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Produto</th><th>Qtd</th><th>Preço</th><th>Subtotal</th><th></th></tr></thead>
          <tbody id="cart-body"></tbody>
        </table></div>
        <div class="cart-total">Total: <strong id="cart-total">R$ 0,00</strong></div>

        <fieldset class="pay-methods">
          <legend>Forma de pagamento</legend>
          <div class="pay-grid">
            <button type="button" class="pay-btn" data-method="CASH" aria-pressed="false">Dinheiro</button>
            <button type="button" class="pay-btn" data-method="PIX" aria-pressed="false">Pix</button>
            <button type="button" class="pay-btn" data-method="DEBIT_CARD" aria-pressed="false">Débito</button>
            <button type="button" class="pay-btn" data-method="CREDIT_CARD" aria-pressed="false">Crédito</button>
          </div>
        </fieldset>

        <div id="cash-box" class="cash-box" hidden>
          <label for="cash-received">Valor entregue pelo cliente (R$)</label>
          <input id="cash-received" class="field-xl" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" />
          <div class="quick-cash" id="cash-received-quick">
            <button type="button" data-cash="exact">Valor exato</button>
            <button type="button" data-cash="5">+ R$ 5</button>
            <button type="button" data-cash="10">+ R$ 10</button>
            <button type="button" data-cash="20">+ R$ 20</button>
            <button type="button" data-cash="50">+ R$ 50</button>
            <button type="button" data-cash="100">+ R$ 100</button>
            <button type="button" data-cash="clear" class="quiet">Limpar</button>
          </div>
          <p id="cash-change" class="change-line" aria-live="polite"></p>
        </div>

        <button id="confirm-sale-btn" class="btn-xl btn-wide" disabled>Confirmar venda</button>
        <p id="sale-hint" class="muted" aria-live="polite"></p>
        <p id="sale-msg" class="error" hidden></p>
      </div>

      <h2>Vendas recentes</h2>
      <div class="card">
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Data</th><th>Vendedor</th><th>Itens</th><th>Pagamento</th><th>Total</th><th></th></tr></thead>
          <tbody id="sales-list"></tbody>
        </table></div>
      </div>
    </section>
  </template>

  <template id="tpl-produtos">
    <section>
      <div class="section-head">
        <h2>Produtos</h2>
        <button id="new-product-btn" data-admin-only>+ Novo produto</button>
      </div>
      <input id="product-search" type="text" placeholder="Buscar produtos..." class="full" aria-label="Buscar produtos" />
      <div class="card">
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Nome</th><th>Categoria</th><th>Estoque</th><th>Mín.</th><th>Preço</th><th data-admin-only>Custo</th><th>Validade</th><th></th></tr></thead>
          <tbody id="products-list"></tbody>
        </table></div>
        <div id="products-pager" class="pager" hidden></div>
      </div>
    </section>
  </template>

  <template id="tpl-product-form">
    <form id="product-form" class="card">
      <h3 id="product-form-title">Novo produto</h3>
      <input type="hidden" id="p-id" />
      <label for="p-name">Nome</label><input id="p-name" required maxlength="150" />
      <label for="p-category">Categoria</label><input id="p-category" maxlength="80" />
      <label for="p-barcode">Código de barras (opcional)</label><input id="p-barcode" maxlength="64" />
      <label for="p-unit">Unidade</label><input id="p-unit" value="UN" maxlength="10" required />
      <label for="p-sale-price">Preço de venda (R$)</label><input id="p-sale-price" type="number" step="0.01" min="0.01" required />
      <label for="p-cost-price">Preço de custo (R$)</label><input id="p-cost-price" type="number" step="0.01" min="0" required />
      <label for="p-min-stock">Estoque mínimo</label><input id="p-min-stock" type="number" step="0.001" min="0" value="0" />
      <label id="p-initial-stock-label" for="p-initial-stock">Estoque inicial</label><input id="p-initial-stock" type="number" step="0.001" min="0" value="0" />
      <label for="p-expiry">Validade (opcional)</label><input id="p-expiry" type="date" />
      <div class="form-actions">
        <button type="submit">Salvar</button>
        <button type="button" id="product-cancel-btn" class="secondary">Cancelar</button>
        <button type="button" id="product-delete-btn" class="danger" hidden>Desativar produto</button>
      </div>
      <p id="product-form-msg" class="error" hidden></p>
    </form>
  </template>

  <template id="tpl-estoque">
    <section>
      <h2>Estoque</h2>
      <div class="grid-2">
        <form id="entry-form" class="card op">
          <h3>Entrada de mercadoria (compra)</h3>
          <label for="entry-product">Produto</label>
          <select id="entry-product" class="field-xl" required></select>
          <label for="entry-qty">Quantidade</label><input id="entry-qty" class="field-xl" type="number" step="0.001" min="0.001" required />
          <label for="entry-expiry">Data de validade do lote</label>
          <input id="entry-expiry" class="field-xl" type="date" required />
          <label class="check"><input id="entry-no-expiry" type="checkbox" /> Produto sem validade (limpeza, higiene...)</label>
          <label for="entry-reason">Observação</label><input id="entry-reason" class="field-xl" maxlength="255" />
          <button type="submit" class="btn-xl btn-wide">Registrar entrada</button>
          <p id="entry-ok" class="success" hidden></p>
          <p id="entry-msg" class="error" hidden></p>
        </form>

        <form id="adjustment-form" class="card op">
          <h3>Ajuste / perda (produto vencido, quebra etc.)</h3>
          <label for="adjustment-product">Produto</label>
          <select id="adjustment-product" class="field-xl" required></select>
          <label for="adjustment-qty">Quantidade a remover</label><input id="adjustment-qty" class="field-xl" type="number" step="0.001" min="0.001" required />
          <label for="adjustment-reason">Motivo</label><input id="adjustment-reason" class="field-xl" maxlength="255" required placeholder="Ex: produto vencido" />
          <button type="submit" class="btn-xl btn-wide">Registrar perda/ajuste</button>
          <p id="adjustment-msg" class="error" hidden></p>
        </form>
      </div>

      <h3>Histórico de movimentações</h3>
      <div class="card">
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Qtd</th><th>Estoque resultante</th><th>Motivo</th><th>Usuário</th></tr></thead>
          <tbody id="movements-list"></tbody>
        </table></div>
        <div id="movements-pager" class="pager" hidden></div>
      </div>
    </section>
  </template>

  <template id="tpl-receipt">
    <div class="card receipt-card" id="receipt-card">
      <h3>Venda confirmada</h3>
      <p class="muted" id="receipt-meta"></p>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Produto</th><th>Qtd</th><th>Preço</th><th>Subtotal</th></tr></thead>
        <tbody id="receipt-items"></tbody>
      </table></div>
      <p class="cart-total">Total: <strong id="receipt-total">R$ 0,00</strong></p>
      <p id="receipt-payment" class="receipt-payment"></p>
      <div class="form-actions no-print">
        <button type="button" id="receipt-print-btn">Imprimir</button>
        <button type="button" id="receipt-close-btn" class="secondary">Nova venda</button>
      </div>
    </div>
  </template>

  <template id="tpl-caixa">
    <section>
      <h2>Caixa</h2>
      <div class="card op">
        <p id="cash-state" class="cash-state"></p>
        <p id="cash-state-meta" class="muted"></p>
        <div id="cash-live" class="grid-cards cash-live" hidden></div>
        <div class="form-actions">
          <button type="button" id="cash-open-btn" class="btn-xl" hidden>Abrir caixa</button>
          <button type="button" id="cash-close-btn" class="btn-xl danger" hidden>Fechar caixa</button>
        </div>
      </div>

      <div id="cash-history-section" hidden>
        <h2>Histórico e conciliação</h2>
        <div class="card">
          <div class="table-wrap"><table class="table">
            <thead><tr><th>Abertura</th><th>Fechamento</th><th>Fundo</th><th>Esperado</th><th>Contado</th><th>Diferença</th><th>Vendas</th><th></th></tr></thead>
            <tbody id="cash-history"></tbody>
          </table></div>
          <div id="cash-pager" class="pager" hidden></div>
        </div>
      </div>
    </section>
  </template>

  <template id="tpl-cash-open">
    <form id="cash-open-form" class="card op">
      <h3>Abrir o caixa</h3>
      <p class="muted">Conte o dinheiro de troco que está na gaveta antes de começar as vendas.</p>
      <label for="cash-opening">Fundo de troco (R$)</label>
      <input id="cash-opening" class="field-xl" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" required />
      <div class="quick-cash" id="cash-opening-quick">
        <button type="button" data-cash="10">+ R$ 10</button>
        <button type="button" data-cash="20">+ R$ 20</button>
        <button type="button" data-cash="50">+ R$ 50</button>
        <button type="button" data-cash="100">+ R$ 100</button>
        <button type="button" data-cash="clear" class="quiet">Limpar</button>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-xl">Abrir caixa</button>
        <button type="button" id="cash-open-later" class="btn-xl secondary">Agora não</button>
      </div>
      <p id="cash-open-msg" class="error" hidden></p>
    </form>
  </template>

  <template id="tpl-cash-close">
    <form id="cash-close-form" class="card op">
      <h3>Fechar o caixa</h3>
      <p class="muted">Conte todo o dinheiro da gaveta, inclusive o fundo de troco, e informe o total. Pix e cartões não entram nessa contagem.</p>
      <label for="cash-counted">Dinheiro contado na gaveta (R$)</label>
      <input id="cash-counted" class="field-xl" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" required />
      <label for="cash-notes">Observações (opcional)</label>
      <textarea id="cash-notes" class="field-xl" rows="2" maxlength="500"></textarea>
      <div class="form-actions">
        <button type="submit" class="btn-xl danger">Fechar caixa</button>
        <button type="button" id="cash-close-cancel" class="btn-xl secondary">Cancelar</button>
      </div>
      <p id="cash-close-msg" class="error" hidden></p>
    </form>
  </template>

  <template id="tpl-cash-summary">
    <div class="card op">
      <h3 id="cash-summary-title">Caixa fechado</h3>
      <div id="cash-summary-body"></div>
      <button type="button" id="cash-summary-ok" class="btn-xl btn-wide">OK</button>
    </div>
  </template>

  <template id="tpl-importar">
    <section>
      <h2>Importar planilha</h2>

      <div class="card" id="imp-step-source">
        <h3>1. Escolha a planilha</h3>
        <p class="muted">Aceita Excel (.xlsx), CSV e arquivos de texto separados por ponto e vírgula, vírgula ou tabulação. As colunas são reconhecidas automaticamente pelo cabeçalho — no passo seguinte você confere e ajusta o que quiser.</p>

        <label for="imp-file">Arquivo</label>
        <input id="imp-file" type="file" accept=".xlsx,.xlsm,.csv,.txt,.tsv" />

        <label for="imp-paste">Ou cole os dados copiados do Excel / Google Planilhas</label>
        <textarea id="imp-paste" rows="4" placeholder="Cole aqui, incluindo a linha de cabeçalho"></textarea>

        <div class="form-actions">
          <button type="button" id="imp-read-btn">Ler planilha</button>
          <a class="link-action" href="/api/imports/products/template">Baixar modelo em Excel</a>
        </div>
        <p id="imp-source-msg" class="error" hidden></p>
      </div>

      <div class="card" id="imp-step-mapping" hidden>
        <h3>2. Confira as colunas</h3>
        <p class="muted" id="imp-grid-info"></p>
        <div class="map-grid" id="imp-map-grid"></div>

        <h3 class="spaced">Como aplicar</h3>
        <div class="grid-3">
          <div>
            <label for="imp-mode">Produtos</label>
            <select id="imp-mode">
              <option value="upsert">Cadastrar novos e atualizar existentes</option>
              <option value="createOnly">Somente cadastrar novos</option>
              <option value="updateOnly">Somente atualizar existentes</option>
            </select>
          </div>
          <div>
            <label for="imp-match-by">Identificar o produto por</label>
            <select id="imp-match-by">
              <option value="barcode">Código de barras (e nome, quando faltar)</option>
              <option value="name">Nome do produto</option>
            </select>
          </div>
          <div>
            <label for="imp-stock-mode">Coluna de estoque</label>
            <select id="imp-stock-mode">
              <option value="ignore">Só no cadastro de produtos novos</option>
              <option value="set">Substituir o saldo atual (balanço)</option>
              <option value="add">Somar ao saldo atual (entrada de mercadoria)</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="imp-preview-btn">Conferir antes de gravar</button>
          <button type="button" id="imp-back-btn" class="secondary">Trocar planilha</button>
        </div>
        <p id="imp-map-msg" class="error" hidden></p>
      </div>

      <div class="card" id="imp-step-preview" hidden>
        <h3>3. Confira o que será gravado</h3>
        <div class="grid-cards" id="imp-summary"></div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Linha</th><th>Ação</th><th>Produto</th><th>Preço de venda</th><th>Estoque</th><th>Observações</th></tr></thead>
          <tbody id="imp-preview-body"></tbody>
        </table></div>
        <div class="form-actions">
          <button type="button" id="imp-commit-btn">Confirmar importação</button>
          <button type="button" id="imp-adjust-btn" class="secondary">Voltar e ajustar</button>
        </div>
        <p id="imp-preview-msg" class="error" hidden></p>
      </div>

      <div class="card" id="imp-step-result" hidden>
        <h3>Importação concluída</h3>
        <p id="imp-result-text"></p>
        <div id="imp-failures" hidden>
          <h3 class="spaced">Linhas que não puderam ser gravadas</h3>
          <div class="table-wrap"><table class="table">
            <thead><tr><th>Linha</th><th>Produto</th><th>Motivo</th></tr></thead>
            <tbody id="imp-failures-body"></tbody>
          </table></div>
        </div>
        <button type="button" id="imp-restart-btn">Importar outra planilha</button>
      </div>
    </section>
  </template>

  <template id="tpl-relatorios">
    <section>
      <h2>Relatórios</h2>
      <div class="card">
        <div class="filters">
          <label for="rep-from">De</label><input id="rep-from" type="date" />
          <label for="rep-to">Até</label><input id="rep-to" type="date" />
          <button id="rep-apply-btn">Aplicar</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h3>Resumo de vendas</h3>
          <p>Total: <strong id="rep-total">R$ 0,00</strong> (<span id="rep-count">0</span> vendas)</p>
          <div class="table-wrap"><table class="table"><thead><tr><th>Dia</th><th>Total</th></tr></thead><tbody id="rep-by-day"></tbody></table></div>
        </div>
        <div class="card">
          <h3>Mais vendidos</h3>
          <div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Qtd vendida</th><th>Receita</th></tr></thead><tbody id="rep-top-products"></tbody></table></div>
        </div>
      </div>

      <div class="card">
        <h3>Produtos parados (capital parado em estoque)</h3>
        <div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Estoque</th><th>Capital parado</th></tr></thead><tbody id="rep-slow-moving"></tbody></table></div>
      </div>
    </section>
  </template>

  <template id="tpl-usuarios">
    <section>
      <div class="section-head">
        <h2>Usuários</h2>
        <button id="new-user-btn">+ Novo usuário</button>
      </div>
      <div class="card">
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ativo</th><th></th></tr></thead>
          <tbody id="users-list"></tbody>
        </table></div>
      </div>
    </section>
  </template>

  <template id="tpl-user-form">
    <form id="user-form" class="card">
      <h3 id="user-form-title">Novo usuário</h3>
      <input type="hidden" id="u-id" />
      <label for="u-name">Nome</label><input id="u-name" required maxlength="120" />
      <label id="u-email-label" for="u-email">E-mail</label><input id="u-email" type="email" required maxlength="255" />
      <label id="u-active-label" for="u-active">Ativo</label><input id="u-active" type="checkbox" checked />
      <label id="u-password-label" for="u-password">Senha</label><input id="u-password" type="password" minlength="8" maxlength="200" />
      <div class="form-actions">
        <button type="submit">Salvar</button>
        <button type="button" id="user-cancel-btn" class="secondary">Cancelar</button>
      </div>
      <p id="user-form-msg" class="error" hidden></p>
    </form>
  </template>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
